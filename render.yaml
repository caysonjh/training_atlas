services:
  - type: web
    name: atlas-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_VERIFY_TOKEN
        sync: false
      - key: STRAVA_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: DB_SEARCH_PATH
        value: public,extensions
      - key: BOOTSTRAP_POSTGIS_EXTENSION
        value: false
      - key: CREATE_TABLES_ON_STARTUP
        value: false
      - key: EMBEDDED_WEBHOOK_WORKER
        value: true
      - key: WEBHOOK_WORKER_POLL_SECONDS
        value: 5
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: SESSION_COOKIE_SAMESITE
        value: none
      - key: DB_POOL_SIZE
        value: 1
      - key: DB_MAX_OVERFLOW
        value: 0
      - key: DB_POOL_TIMEOUT_SECONDS
        value: 5
